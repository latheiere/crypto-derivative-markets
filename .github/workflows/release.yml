name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import pathlib
          import re
          import os

          source = pathlib.Path("src/cdm/__init__.py").read_text(encoding="utf-8")
          package_version = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if package_version is None:
              raise SystemExit("package version was not found")
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if package_version.group(1) != tag_version:
              raise SystemExit("tag and package versions differ")
          PY
      - name: Run full release verification
        run: make verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
